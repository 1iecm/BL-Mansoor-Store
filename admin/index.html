<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BL-Mansoor Admin</title>

    <link rel="stylesheet" href="admin.css">
</head>

<body>

    <main class="login-page">

        <div class="login-card">

            <div class="login-logo">
                <span>BL-</span>Mansoor
            </div>

            <div class="login-subtitle">
                Business Land Al-Mansoor
            </div>

            <h1>
                تسجيل الدخول
            </h1>

            <p class="login-description">
                لوحة إدارة المتجر
            </p>


            <form id="loginForm">

                <div class="form-group">

                    <label for="username">
                        اسم المستخدم
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="أدخل اسم المستخدم"
                        autocomplete="username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        كلمة المرور
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="أدخل كلمة المرور"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <div
                    id="loginMessage"
                    class="login-message">
                </div>


                <button
                    type="submit"
                    class="login-button">

                    دخول إلى لوحة الإدارة

                </button>

            </form>


            <div class="login-footer">
                BL-Mansoor Admin
            </div>

        </div>

    </main>


    <script src="admin.js"></script>

</body>
</html>
